apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    chart: external-dns
    # Pinned exactly: chart 1.22.0 (app v0.22.0) shipped a breaking change in a
    # MINOR bump — the default annotation prefix lost its fallback, which made
    # external-dns see zero hostnames and delete every record it owned.
    # A floating "1.*" range let that land unattended. Bump deliberately.
    targetRevision: "1.22.0"
    helm:
      values: |
        provider:
          name: cloudflare
        # Scoped token (Zone:Read + DNS:Write on tonioriol.com) instead of the
        # account Global API key, so DNS changes are attributed to external-dns
        # rather than the account owner. Synced from 1Password by the
        # ExternalSecret in charts/external-secrets-config.
        deploymentAnnotations:
          secret.reloader.stakater.com/reload: external-dns-cloudflare-token
        env:
          - name: CF_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: external-dns-cloudflare-token
                key: CF_API_TOKEN
        domainFilters:
          - tonioriol.com
        policy: sync
        txtOwnerId: neumann
        # Uses the v0.22.0 default prefix (external-dns.kubernetes.io/).
        # Services carry both prefixes during the migration, so this reads the
        # new one while the legacy annotations stay in place as a fallback.
        sources:
          - service
          - ingress
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
