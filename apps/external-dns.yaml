apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    chart: external-dns
    # Pinned exactly: chart 1.22.0 (app v0.22.0) shipped a breaking change in a
    # MINOR bump — the default annotation prefix lost its fallback, which made
    # external-dns see zero hostnames and delete every record it owned.
    # A floating "1.*" range let that land unattended. Bump deliberately.
    targetRevision: "1.22.0"
    helm:
      values: |
        provider:
          name: cloudflare
        env:
          - name: CF_API_KEY
            valueFrom:
              secretKeyRef:
                name: external-dns-cloudflare
                key: CF_API_KEY
          - name: CF_API_EMAIL
            valueFrom:
              secretKeyRef:
                name: external-dns-cloudflare
                key: CF_API_EMAIL
        domainFilters:
          - tonioriol.com
        policy: sync
        txtOwnerId: neumann
        # v0.22.0 defaults to "external-dns.kubernetes.io/" with NO fallback.
        # Every Service here still uses the legacy alpha prefix, so keep reading it.
        annotationPrefix: external-dns.alpha.kubernetes.io/
        sources:
          - service
          - ingress
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
