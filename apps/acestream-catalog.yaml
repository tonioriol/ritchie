apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: acestream-catalog
  namespace: argocd
  # Branch images are selected explicitly until v2 is released on main.
  # Catalog is also excluded from the shared ImageUpdater CR during this period.
spec:
  project: default
  source:
    repoURL: https://github.com/tonioriol/ritchie.git
    targetRevision: main
    path: charts/acestream-catalog
    helm:
      # Replace any old semver parameter written back by Image Updater.
      parameters:
        - name: image.tag
          value: v2-latest
          forceString: true
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
