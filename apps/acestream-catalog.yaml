apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: acestream-catalog
  namespace: argocd
  # Catalog images are built manually and pinned to the mutable `latest` tag;
  # Image Updater does not track this app.
spec:
  project: default
  source:
    repoURL: https://github.com/tonioriol/ritchie.git
    targetRevision: main
    path: charts/acestream-catalog
    helm:
      # Replace any old semver parameter written back by Image Updater.
      parameters:
        - name: image.tag
          value: latest
          forceString: true
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
