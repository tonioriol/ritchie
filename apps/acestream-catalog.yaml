apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: acestream-catalog
  namespace: argocd
  # Image Updater (apps/argocd-image-updater.yaml) deploys the highest vX.Y.Z tag.
spec:
  project: default
  source:
    repoURL: https://github.com/tonioriol/ritchie.git
    targetRevision: main
    path: charts/acestream-catalog
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
