apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: {{ .Release.Name }}-auth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: FEED_TOKEN
      remoteRef:
        key: acestream-scraper
        property: password
    - secretKey: ADMIN_TOKEN
      remoteRef:
        key: acestream-catalog
        property: admin_token
    - secretKey: LLM_API_KEY
      remoteRef:
        key: ccx
        property: api_key
