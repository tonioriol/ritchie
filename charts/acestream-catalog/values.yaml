image:
  repository: ghcr.io/tonioriol/acestream-catalog
  tag: "v0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull

persistence:
  size: 2Gi

env:
  STREAM_BASE_URL: https://ace.tonioriol.com
  PUBLIC_BASE_URL: https://catalog.tonioriol.com
  XMLTV_PATH: /data/epg.xml

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi

refresh:
  schedule: "0 */3 * * *"
  activeDeadlineSeconds: 7200
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  engine:
    image:
      repository: ghcr.io/tonioriol/acestream-engine
      tag: latest
      pullPolicy: Always
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 768Mi

externalDns:
  enabled: true
  hostname: catalog.tonioriol.com
  target: "85e6bc75-0025-4fc3-9341-d4e517fea614.cfargotunnel.com"
