fullname: workspace-cli

image:
  repository: nginx
  tag: "1.28.0-alpine"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  port: 80
  targetPort: 80

resources:
  requests:
    cpu: 5m
    memory: 32Mi
  limits:
    cpu: 50m
    memory: 64Mi

imagePullSecrets: []

externalDns:
  enabled: true
  hostname: workspace-cli.tonioriol.com
  target: "85e6bc75-0025-4fc3-9341-d4e517fea614.cfargotunnel.com"
