image:
  repository: ghcr.io/tonioriol/personal-catalogs
  # Image Updater bumps this to the highest vX.Y.Z release.
  tag: v1.0.0
hostname: catalogs.tonioriol.com
tunnelTarget: 85e6bc75-0025-4fc3-9341-d4e517fea614.cfargotunnel.com
persistence:
  # Hetzner's minimum is 10 GB; 1Gi claims do not provision a smaller disk.
  size: 10Gi
  storageClass: hcloud-volumes
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
