apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: {{ .Release.Name }}-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range $field, $env := dict "state_encryption_key" "STATE_ENCRYPTION_KEY" "trakt_client_id" "TRAKT_CLIENT_ID" "tmdb_api_key" "TMDB_API_KEY" "nuvio_url" "NUVIO_URL" "nuvio_anon_key" "NUVIO_ANON_KEY" "nuvio_email" "NUVIO_EMAIL" "nuvio_password" "NUVIO_PASSWORD" "profile_toni_token" "PROFILE_TONI_TOKEN" "profile_laura_token" "PROFILE_LAURA_TOKEN" }}
    - secretKey: {{ $env }}
      remoteRef:
        key: personal-catalogs
        property: {{ $field }}
    {{- end }}
