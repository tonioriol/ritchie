apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-auth
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: {{ .Release.Name }}-auth
    creationPolicy: Owner
  data:
    - secretKey: CLICKHOUSE_CCX_PASSWORD
      remoteRef:
        key: {{ .Values.auth.itemId }}
        property: password
    - secretKey: CLICKHOUSE_ADMIN_PASSWORD
      remoteRef:
        key: {{ .Values.auth.itemId }}
        property: admin_password
{{- if .Values.backup.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-backup
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: {{ .Release.Name }}-backup
    creationPolicy: Owner
  data:
    - secretKey: CLICKHOUSE_ADMIN_PASSWORD
      remoteRef:
        key: {{ .Values.auth.itemId }}
        property: admin_password
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: {{ .Values.auth.itemId }}
        property: {{ .Values.backup.accessKeyField }}
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: {{ .Values.auth.itemId }}
        property: {{ .Values.backup.secretKeyField }}
{{- end }}
