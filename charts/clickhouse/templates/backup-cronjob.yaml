{{- if .Values.backup.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-backup-script
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
data:
  # Backs up database ccx to Object Storage with ClickHouse's own BACKUP.
  # Full on Sundays or when no full is recorded; otherwise incremental on the
  # latest full, so a restore needs at most two backups. Nothing is ever
  # deleted from the bucket. LATEST_FULL in the bucket names the current base.
  backup.sh: |
    set -eu
    E="$S3_ENDPOINT"
    K="'$S3_ACCESS_KEY', '$S3_SECRET_KEY'"
    q() { clickhouse-client --host "$CH_HOST" --user admin --password "$CLICKHOUSE_ADMIN_PASSWORD" --query "$1"; }
    stamp=$(date -u +%Y%m%dT%H%M%SZ)
    latest=$(q "SELECT line FROM s3('$E/LATEST_FULL', $K, 'LineAsString') LIMIT 1" 2>/dev/null || true)
    if [ "$(date -u +%u)" = 7 ] || [ -z "$latest" ]; then
      name="full-$stamp"
      id=$(q "BACKUP DATABASE ccx TO S3('$E/$name', $K) ASYNC" | cut -f1)
    else
      name="inc-$stamp"
      id=$(q "BACKUP DATABASE ccx TO S3('$E/$name', $K) SETTINGS base_backup = S3('$E/$latest', $K) ASYNC" | cut -f1)
    fi
    echo "backup $name (base: ${latest:-none}) id $id"
    while :; do
      status=$(q "SELECT status FROM system.backups WHERE id = '$id'")
      case "$status" in
        BACKUP_CREATED) break ;;
        CREATING_BACKUP|"") sleep 15 ;;
        *) q "SELECT status, error FROM system.backups WHERE id = '$id' FORMAT Vertical"; exit 1 ;;
      esac
    done
    q "SELECT name, status, num_files, formatReadableSize(total_size), formatReadableSize(uncompressed_size), end_time - start_time AS seconds FROM system.backups WHERE id = '$id' FORMAT Vertical"
    case "$name" in
      full-*) q "INSERT INTO FUNCTION s3('$E/LATEST_FULL', $K, 'LineAsString') SETTINGS s3_truncate_on_insert = 1 VALUES ('$name')" ;;
    esac
    q "SELECT table, sum(rows) FROM system.parts WHERE database = 'ccx' AND active GROUP BY table ORDER BY table"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-backup
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              command: ["/bin/sh", "/scripts/backup.sh"]
              env:
                - name: CH_HOST
                  value: {{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local
                - name: S3_ENDPOINT
                  value: {{ required "backup.endpoint" .Values.backup.endpoint | quote }}
              envFrom:
                - secretRef:
                    name: {{ .Release.Name }}-backup
              volumeMounts:
                - name: script
                  mountPath: /scripts
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: script
              configMap:
                name: {{ .Release.Name }}-backup-script
{{- end }}
