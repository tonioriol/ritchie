apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
data:
  # Small-node tuning measured for ccx's data (spec E1, config_mid.xml).
  neumann.xml: |
    <clickhouse>
      <logger>
        <level>warning</level>
        <console>1</console>
      </logger>
      <listen_host>0.0.0.0</listen_host>
      <max_server_memory_usage>{{ .Values.maxServerMemoryBytes }}</max_server_memory_usage>
      <background_pool_size>2</background_pool_size>
      <background_merges_mutations_concurrency_ratio>2</background_merges_mutations_concurrency_ratio>
      <background_schedule_pool_size>16</background_schedule_pool_size>
      <merge_tree>
        <number_of_free_entries_in_pool_to_execute_mutation>2</number_of_free_entries_in_pool_to_execute_mutation>
        <number_of_free_entries_in_pool_to_lower_max_size_of_merge>2</number_of_free_entries_in_pool_to_lower_max_size_of_merge>
        <number_of_free_entries_in_pool_to_execute_optimize_entire_partition>2</number_of_free_entries_in_pool_to_execute_optimize_entire_partition>
      </merge_tree>
      <mark_cache_size>67108864</mark_cache_size>
      <index_mark_cache_size>16777216</index_mark_cache_size>
      <uncompressed_cache_size>0</uncompressed_cache_size>
      <index_uncompressed_cache_size>0</index_uncompressed_cache_size>
      <query_condition_cache_size>16777216</query_condition_cache_size>
      <compiled_expression_cache_size>16777216</compiled_expression_cache_size>
      <mmap_cache_size>64</mmap_cache_size>
      <!-- system log tables would grow without bound on a small volume -->
      <query_log replace="1">
        <database>system</database>
        <table>query_log</table>
        <engine>ENGINE = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + INTERVAL 14 DAY</engine>
        <flush_interval_milliseconds>7500</flush_interval_milliseconds>
      </query_log>
      <trace_log remove="1"/>
      <metric_log remove="1"/>
      <asynchronous_metric_log remove="1"/>
      <text_log remove="1"/>
      <part_log remove="1"/>
      <processors_profile_log remove="1"/>
      <latency_log remove="1"/>
      <error_log remove="1"/>
      <query_metric_log remove="1"/>
    </clickhouse>
  users.xml: |
    <clickhouse>
      <profiles>
        <default>
          <max_memory_usage>{{ .Values.maxQueryMemoryBytes }}</max_memory_usage>
          <max_threads>2</max_threads>
          <min_insert_block_size_bytes>33554432</min_insert_block_size_bytes>
          <max_insert_block_size_bytes>33554432</max_insert_block_size_bytes>
        </default>
      </profiles>
      <users>
        <default remove="1"/>
        <admin>
          <password from_env="CLICKHOUSE_ADMIN_PASSWORD"/>
          <networks><ip>::/0</ip></networks>
          <profile>default</profile>
          <quota>default</quota>
          <access_management>1</access_management>
          <named_collection_control>1</named_collection_control>
        </admin>
        <ccx>
          <password from_env="CLICKHOUSE_CCX_PASSWORD"/>
          <networks><ip>::/0</ip></networks>
          <profile>default</profile>
          <quota>default</quota>
          <grants>
            <query>GRANT ALL ON ccx.*</query>
            <query>GRANT CREATE DATABASE ON ccx.*</query>
          </grants>
        </ccx>
      </users>
      <quotas><default/></quotas>
    </clickhouse>
