apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: {{ .Values.updateStrategy.type | default "RollingUpdate" }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
      annotations:
        checksum/cleanup: {{ .Files.Get "files/engine_cleanup.py" | sha256sum }}
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsUser: {{ .Values.acestream.runAsUser }}
      containers:
        - name: acestream
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-c"]
          args:
            - |
              import runpy, sys
              sys.path.insert(0, '/opt/acestream-cleanup')
              import engine_cleanup
              engine_cleanup.install()
              sys.argv = ['main.py', '--bind-all', '--live-cache-type', 'memory', '--live-mem-cache-size', '104857600', '--disable-sentry', '--log-stdout', '--disable-upnp']
              runpy.run_path('/acestream/main.py', run_name='__main__')
          {{- if .Values.resources }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}
          # jopsis/acestream sets its own env vars (ACESTREAM_HOME, PYTHONPATH, etc.)
          # via the image. No extra env vars needed — remote access is enabled by
          # default and --bind-all is in the CMD.
          securityContext:
            privileged: {{ .Values.acestream.privileged }}
          # AceStream engine health: /webui/api/service?method=get_version returns
          # JSON {"result":{"version":"..."},"error":null} when the engine is responsive.
          # When the engine hangs (common symptom: streams "loading forever"), this
          # endpoint stops responding and the liveness probe will restart the pod.
          readinessProbe:
            httpGet:
              path: /webui/api/service?method=get_version
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /webui/api/service?method=get_version
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /webui/api/service?method=get_version
              port: http
            # AceStream engine can take a while to initialise (loading P2P state, etc.)
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 18  # 10s + 18*10s = up to ~190s to start
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: probe
              containerPort: {{ .Values.probe.port }}
              protocol: TCP
            {{- if .Values.p2p.enabled }}
            # Improve inbound connectivity: bind P2P/control ports on the node.
            - name: p2p-tcp
              containerPort: {{ .Values.p2p.port }}
              hostPort: {{ .Values.p2p.port }}
              protocol: TCP
            - name: p2p-udp
              containerPort: {{ .Values.p2p.port }}
              hostPort: {{ .Values.p2p.port }}
              protocol: UDP
            - name: i2i-tcp
              containerPort: {{ .Values.p2p.i2iPort }}
              hostPort: {{ .Values.p2p.i2iPort }}
              protocol: TCP
            {{- end }}
          volumeMounts:
            - name: acestream-data
              mountPath: {{ .Values.acestream.stateDir }}
            - name: cleanup
              mountPath: /opt/acestream-cleanup
              readOnly: true
      volumes:
        - name: cleanup
          configMap:
            name: {{ .Release.Name }}-cleanup
        - name: acestream-data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
