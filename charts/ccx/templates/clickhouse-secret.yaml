{{- if .Values.clickhouse.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-clickhouse
  labels:
    {{- include "ccx.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: {{ .Release.Name }}-clickhouse
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        clickhouse.json: |
          {"url": {{ .Values.clickhouse.url | quote }}, "user": {{ .Values.clickhouse.user | quote }}, "password": "{{ "{{" }} .password {{ "}}" }}", "database": {{ required "clickhouse.database" .Values.clickhouse.database | quote }}}
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.clickhouse.itemId }}
        property: password
{{- end }}
