apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-smtp
  labels:
    app: {{ .Release.Name }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: {{ .Release.Name }}-smtp
    creationPolicy: Owner
  data:
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: {{ .Values.smtp.itemId }}
        property: {{ .Values.smtp.passwordField }}
